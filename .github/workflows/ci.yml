name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify source and secrets
        run: python3 tools/check-source.py
      - name: Verify imported skills
        run: python3 tools/check-skills.py
      - name: Verify Go dependencies
        run: go mod verify
      - name: Backend tests
        run: |
          go test -count=1 ./...
          go test -race ./internal/orderstream
      - name: Static checks
        run: go vet ./...
      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Frontend vulnerabilities
        run: npm audit --prefix frontend --audit-level=high
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Install isolated browser harness
        run: npm install --prefix .cache/browser-tests --no-save puppeteer@24.40.0
      - name: Browser workflows
        env:
          PUPPETEER_MODULE: ${{ github.workspace }}/.cache/browser-tests/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js
        run: |
          node tools/test-security-browser.mjs
          node tools/test-payments-browser.mjs
          node tools/test-workspace-browser.mjs
          node tools/test-dashboard-overview-browser.mjs
          node tools/test-menu-cash-browser.mjs
          node tools/test-buyer-browser.mjs
          node tools/test-buyer-cookie-browser.mjs
          node tools/test-shopper-account-browser.mjs
          node tools/test-order-stream-browser.mjs
          node tools/test-storefront-operations-browser.mjs
          node tools/test-commerce-experience-browser.mjs
          node tools/test-options-capacity-browser.mjs
          node tools/test-hierarchy-browser.mjs
          node tools/test-care-browser.mjs
          node tools/test-motion-browser.mjs
          node tools/test-loading-layout-browser.mjs
          LAYOUT_WIDTH=1366 LAYOUT_HEIGHT=768 LAYOUT_POPULATED=1 node tools/test-loading-layout-browser.mjs
